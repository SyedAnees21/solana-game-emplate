[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_game_template = "3UYVFTzKfxT842KUoWrqLsZf1PJ1anCVU1rCvZcFwMSx"

[registry]
url = "https://api.apr.dev"

[provider]
